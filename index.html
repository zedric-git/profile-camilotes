<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zedric Camilotes — Developer Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Fredoka:wght@600;700&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=16">
</head>
<body class="is-loading">

  <div id="loader" aria-hidden="true">
    <canvas id="loader-canvas"></canvas>
    <div class="loader-grid">
      <div class="loader-col loader-col-left">
        <div class="loader-scroll">
          <ul class="loader-scroll-list" id="loader-scroll-list"></ul>
        </div>
      </div>
      <div class="loader-percent">
        <span class="loader-percent-paren">(</span><span id="loader-percent-num">00</span><span class="loader-percent-sign">%</span><span class="loader-percent-paren">)</span>
      </div>
      <div class="loader-col loader-col-right">
        <p class="loader-type" id="loader-type"></p>
      </div>
    </div>
  </div>

  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <div class="scratch-hero-track" id="scratch-hero-track">
    <div class="sticky-stage">
      <div class="scratch-hero-container">
        
        <!-- Left Column: Floating Scramble Text, Arrow & Tagline -->
        <div class="hero-left-col floating-unit">
          <div class="meta-tag" id="type-doctype">&lt;!DOCTYPE developer&gt;</div>
          
          <div class="text-stage-wrapper">
            <h1 class="scratch-headline" id="scratch-text-left">
              <span class="scramble-line" id="line-1">SCROLL TO</span>
              <span class="scramble-line" id="line-2">SCRATCH THE</span>
              <span class="scramble-line" id="line-3">CARD</span>
            </h1>
          </div>

          <div class="reveal-swap-stage">
            <div class="arrow-container" id="scratch-arrow-wrap">
              <svg class="scratch-arrow-svg" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 20H100M100 20L82 6M100 20L82 34" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>

            <!-- Revealed Tagline Unit (Appears after scroll reveal) -->
            <div class="tagline-unit" id="tagline-unit">
              <div class="tech-divider-line" id="hero-divider" aria-hidden="true"></div>
              <p class="identity-tagline" id="type-tagline">
                just a guy who achieves full potential near deadlines.
              </p>
            </div>
          </div>
        </div>

        <!-- Right Column: Silver Metallic Scratch Card -->
        <div class="hero-right-col">
          <div class="scratch-card-wrapper" id="scratch-card-wrapper">
            <div class="scratch-card-frame">
              <img src="assets/avatar.jpg" alt="Zedric Camilotes" class="scratch-avatar-img" id="scratch-avatar" />
              <canvas id="scratch-canvas"></canvas>
              <div class="scratch-shine-overlay"></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="script.js?v=16"></script>
</body>
</html>
